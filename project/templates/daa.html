<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAA PROJECT</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background-color: black;
      margin: 0;
      min-height: 200vh;
      font-size: 0;
      font-family: Helvetica, Verdana, sans-serif;
      height: 100%;
        }

        html {
            overflow: hidden;
            height: 100%;
        }

    

    nav {
      position: fixed;
      top: 35px;
      left: 0;
      width: 100%;
      padding: 16px 20px 30px 20px;
      display: flex;
      align-items: center;
      transition: 0.3s ease-out;
      backdrop-filter: blur(8px) brightness(1.2);
      -webkit-backdrop-filter: blur(8px) brightness(1.2);
      text-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
      color: white;
      font-size: 16px;
      z-index: 10;
    }

    .list {
      list-style-type: none;
      margin: 0;
      padding: 0;
      display: flex;
    }

    @media (min-width: 640px) {
      .list {
        justify-content: flex-end;
        flex: 1;
      }
    }
    @media (max-width: 600px) {
  nav {
    display: none;
  }
}

    .list li {
      margin-right: 20px;
    }

    nav.is-hidden {
      transform: translateY(-100%);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
      z-index: 3;
    }

    .text-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 23px;
      font-weight: bold;
      text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.7);
      text-align: center;
      z-index: 1;
      margin: 20px 0;  /* Space above and below the line */

    }

    .white-btn {
      padding: 14px 28px;
      font-size: 18px;
      color: #0b0b0b;
      background-color: white;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: 0.3s ease-in-out;
      box-shadow: 0px 5px 15px rgba(65, 63, 63, 0.2);
      position: relative;
      z-index: 2;
    }

    .white-btn:hover {
      background-color: #8e8383;
      transform: scale(1.05);
    }

    .video-container {
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      z-index: -1;
    }

    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: none;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 100%;
      background: rgba(32, 30, 30, 0.2);
      pointer-events: none;
    }
  </style>
</head>

<body>
  <nav>
    <ul class="list">
      <li><a href="{{ url_for('daa') }}">Home</a></li>
      <li><a href="{{ url_for('about') }}" >About</a></li>
      <li><a href="{{ url_for('project') }}">Project</a></li>
    </ul>
  </nav><div class="video-container">
    <video autoplay muted loop playsinline>
      <source src="{{ url_for('static', filename='video.mp4') }}" type="video/mp4">
      Your browser does not support the video tag.
    </video>
    <div class="overlay"></div>
  </div>
  

  <div class="text-overlay">
    <div class="container">
      <h1 class="catchy-line">RouteWise:Finding the Best Way to NED</h1>
      <p class="catchy-line">Navigate Smarter, Arrive Quicker – Click below to explore the project
        details!</p>
        <a href="{{ url_for('about') }}" class="white-btn">Explore More...</a>
      </div>
  </div>

  <script>
    const links = document.querySelectorAll('.list a');
    const currentPage = window.location.pathname.split("/").pop();
  
    links.forEach(link => {
      if (link.getAttribute('href') === currentPage) {
        link.style.textDecoration = "underline";
        link.style.fontWeight = "bold";
      }
    });
  </script>

</body>


</html>
