<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Path Finder</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body,
    html {
      background-color: #f5f5f5;
      margin: 0;
      font-family: Helvetica, Verdana, sans-serif;
      padding: 0;
    }

    .container {
      max-width: 900px;
      margin: 120px auto;
      padding: 30px;
      background-color: #083d56d6;
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(250, 18, 18, 0.1);
      color: black;
      text-align: center;
    }

    .container:hover {
      transform: translateY(-10px);
      box-shadow: 0 0 25px #78c4c4;
    }

    h1 {
      font-size: 2rem;
      color: black;
    }

    h2 {
      font-size: 1.2rem;
      color: white;
    }

    select,
    button {
      padding: 12px 16px;
      font-size: 1rem;
      margin: 10px;
      border-radius: 8px;
      border: none;
    }

    select {
      width: 200px;
      background-color: #388892;
    }

    button {
      background-color: #923838;
      color: #fff;
      cursor: pointer;
      justify-content: flex-end;
    }

    button:hover {
      background-color: #a85050;
    }

    .result {
      margin-top: 30px;
      padding: 20px;
      background-color: #767272;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.4);
    }

    .result h3 {
      color: #0adae1;
    }

    nav {
      position: fixed;
      top: 35px;
      left: 0;
      width: 100%;
      padding: 16px 20px 30px 20px;
      display: flex;
      align-items: center;
      color: white;
      font-size: 16px;
      z-index: 10;
      background-color: #388892b2;
    }

    .list {
      list-style-type: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex: 1;
      justify-content: flex-end;
    }

    .list li {
      margin-right: 20px;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      nav {
        display: none;
      }
    }

    .dropdown {
      position: relative;
      width: 200px;
      margin: 0 auto;
    }

    .path-result {
      margin-top: 20px;
      padding: 15px;
      background-color: #cce7f7;
      border-radius: 10px;
      color: #3b5998;
    }

    .path-result h4 {
      margin-bottom: 10px;
    }
  </style>
</head>

<body>
  <nav>
    <ul class="list">
      <li><a href="{{ url_for('daa') }}">Home</a></li>
      <li><a href="{{ url_for('about') }}">About</a></li>
      <li><a href="{{ url_for('project') }}">Project</a></li>
    </ul>
  </nav>


  <div class="container">
    <h1>Smart Path Finder</h1>
    <h2>Choose your locations:</h2>

    <div class="dropdown">
      <label for="startLocation" style="color:white;">Start Location:</label><br>
      <select id="startLocation">
        <option value="north_karachi">North Karachi</option>
        <option value="north_nazimabad">North Nazimabad</option>
        <option value="water_pump">Water Pump</option>
        <option value="gulshan">Gulshan</option>
      </select>
    </div>


    <div class="dropdown">
      <label for="goalLocation" style="color:white;">Destination Location:</label><br>
      <select id="goalLocation">
        <option value="ned_main_gate">NED Main Gate</option>
        <option value="ned_maskan_gate">NED Maskan Gate</option>
        <option value="ned_staff_gate">NED Staff Gate</option>
        <option value="ned_visitors_gate">NED Visitors Gate</option>
      </select>
    </div>


    <!-- Multi Source Input -->
    <div style="margin-top: 15px;">
      <label for="multiSources" style="color:white;">(Optional) Enter multiple sources separated by commas:</label><br>
      <input type="text" id="multiSources" placeholder="e.g., Water Pump,Gulshan"
        style="width: 70%; padding: 10px; margin-top: 10px;" aria-label="Enter multiple source locations">
    </div>

    <br />
    <div style="display: flex; justify-content: flex-end;">
      <!-- Accessible button with aria-label -->
      <button type="button" onclick="submitForm()" aria-label="Submit the form to find the path">Submit</button>
    </div>
    <div id="resultsContainer" style="margin-top: 30px;"></div>

  </div>

  <script>
    function submitForm() {
      const start = document.getElementById("startLocation").value;
      const goal = document.getElementById("goalLocation").value;
      const multiSources = document.getElementById("multiSources").value;

      const resultsContainer = document.getElementById("resultsContainer");

      // Clear previous results before adding new ones
      resultsContainer.innerHTML = "";

      fetch("/run_algorithm", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          start: formatName(start),
          goal: formatName(goal),
          multi_sources: multiSources ? multiSources.split(",").map(s => formatName(s.trim())) : []
        })
      })

        .then(response => response.json())
        .then(data => {
          if (data.results) {
            data.results.forEach(result => {
              const pathText = result.path && result.path.length > 0 ? result.path.join(" → ") : "No path found";
              const altPathText = result.alt_path && result.alt_path.length > 0 ? result.alt_path.join(" → ") : "N/A";

              resultsContainer.innerHTML += `
                <div class="path-result">
                  <h4>${result.algorithm}:</h4>
                  <p><strong>Path:</strong> ${pathText}</p>
                  <p><strong>Total Time:</strong> ${result.total_time} mins</p>
                  <p><strong>Alternate Path:</strong> ${altPathText}</p>
                  <p><strong>Alternate Time:</strong> ${result.alt_time} mins</p>
                  <img src="${result.graph}" alt="Graph for ${result.algorithm}" style="max-width: 100%; height: auto;" />
                </div>
              `;
            });

            if (data.multi_source_graph) {
              resultsContainer.innerHTML += `
                <div style="margin-top: 30px;">
                  <h3>Multi-Source Graph</h3>
                  <img src="${data.multi_source_graph}" alt="Graph showing the multi-source paths" style="max-width: 100%; height: auto;" />
                </div>
              `;
            }
         
          } else {
            alert("Error: " + data.error);
          }
        })
        .catch(error => {
          console.error("Error:", error);
        });
    }

    function formatName(code) {
      const map = {
        north_karachi: "North Karachi",
        north_nazimabad: "North Nazimabad",
        water_pump: "Water Pump",
        gulshan: "Gulshan",
        ned_main_gate: "NED Main Gate",
        ned_maskan_gate: "NED Maskan Gate",
        ned_staff_gate: "NED Staff Gate",
        ned_visitors_gate: "NED Visitors Gate"
      };
      return map[code] || code;
    }


  </script>

  <script>
    const links = document.querySelectorAll('.list a');
    const currentPage = window.location.pathname.split("/").pop();

    links.forEach(link => {
      if (link.getAttribute('href') === currentPage) {
        link.style.textDecoration = "underline";
        link.style.fontWeight = "bold";
      }
    });
  </script>

</body>

</html>
